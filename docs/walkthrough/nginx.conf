server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # narration + scene visuals stream; let the browser range-request them
    location /walkthrough/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # the tour page itself must never be served stale
    location = /overview.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = / {
        add_header Cache-Control "no-store, must-revalidate";
    }

    types {
        text/html      html;
        audio/mpeg     mp3;
        video/mp4      mp4;
        image/png      png;
        text/css       css;
        application/javascript js;
        application/json json;
    }
    default_type application/octet-stream;
}
